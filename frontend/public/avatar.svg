<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 104" width="104" height="104" role="img" aria-label="头像占位图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b8cf0"/>
      <stop offset="55%" stop-color="#6d5ce7"/>
      <stop offset="100%" stop-color="#3f2fb8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round">
      <rect width="104" height="104" rx="26" ry="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="104" height="104" fill="url(#bg)"/>
    <circle cx="30" cy="26" r="34" fill="url(#glow)"/>
    <circle cx="80" cy="88" r="40" fill="#22d3ee" opacity="0.22"/>
    <circle cx="18" cy="92" r="30" fill="#fb7185" opacity="0.20"/>

    <!-- 抽象的头肩剪影 -->
    <circle cx="52" cy="42" r="15" fill="#ffffff" opacity="0.92"/>
    <path d="M52 62c17 0 30 11 30 25v17H22V87c0-14 13-25 30-25Z" fill="#ffffff" opacity="0.92"/>
  </g>

  <rect x="0.5" y="0.5" width="103" height="103" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
</svg>